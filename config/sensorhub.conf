# Linux SensorHub 用户态服务配置文件
# 初学者提示：key=value 左边是配置名，右边是配置值。

device_path=/dev/sensorhub0
log_file=logs/sensorhub.log
control_socket=run/sensorhub.sock
tcp_listen_port=9090
udp_export_host=127.0.0.1
udp_export_port=9091
worker_threads=2
log_rotate_bytes=1048576
queue_capacity=1024
simulate_device=false
sensor_interval_ms=500
